# Render Blueprint — https://render.com/docs/blueprint-spec
# Render 대시보드 → New → Blueprint 에서 이 저장소를 선택하면 자동 배포됩니다.
services:
  - type: web
    name: warfield
    runtime: node
    plan: free           # 15분 동안 접속이 없으면 잠들고, 다음 접속 때 약 1분 뒤 깨어납니다
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
